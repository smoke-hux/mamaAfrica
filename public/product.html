<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2A1A11">
  <title>Product | Mama Afrika Market</title>
  <meta name="description" content="Product details, ingredients and shipping information from Mama Afrika Market.">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/site.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body data-page="product">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <nav class="breadcrumb container" aria-label="Breadcrumb" data-breadcrumb>
      <ol>
        <li><a href="/">Home</a></li>
        <li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m9 18 6-6-6-6"/></svg></li>
        <li><a href="/shop.html">Shop</a></li>
      </ol>
    </nav>

    <div data-product-root aria-live="polite" aria-busy="true">
      <div class="container pdp-skeleton" aria-hidden="true">
        <div class="skeleton" style="aspect-ratio:1"></div>
        <div class="stack">
          <div class="skeleton" style="height:14px;width:30%"></div>
          <div class="skeleton" style="height:44px;width:80%"></div>
          <div class="skeleton" style="height:18px;width:40%"></div>
          <div class="skeleton" style="height:36px;width:35%"></div>
          <div class="skeleton" style="height:60px;width:100%"></div>
          <div class="skeleton" style="height:52px;width:100%"></div>
        </div>
      </div>
    </div>

    <section class="section section--tight" aria-labelledby="related-title" data-related hidden>
      <div class="container">
        <div class="section-head">
          <div>
            <p class="eyebrow">Goes well with</p>
            <h2 id="related-title">More from this <span class="italic-accent">aisle.</span></h2>
          </div>
          <a class="section-head__link" href="/shop.html" data-related-link>See the aisle
            <svg class="icon icon--sm" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
          </a>
        </div>
        <div class="grid grid--products" data-related-grid></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script type="module" src="/js/layout.js"></script>
  <script type="module" src="/js/pages/product.js"></script>
</body>
</html>
