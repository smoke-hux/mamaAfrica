<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="t">
<title id="t">Organic Rooibos Tea</title>
<defs>
<pattern id="p" width="100" height="100" patternUnits="userSpaceOnUse">
<rect x="0" y="0" width="100" height="14" fill="#F2A93B"/>
<rect x="0" y="24" width="100" height="6" fill="#FFF9EF"/>
<rect x="0" y="50" width="100" height="14" fill="#2A1A11"/>
<rect x="0" y="74" width="100" height="6" fill="#FFF9EF"/>
<rect x="44" y="0" width="12" height="100" fill="#FFF9EF"/>
</pattern>
</defs>
<rect width="600" height="600" fill="#B4532A"/>
<rect width="600" height="600" fill="url(#p)" opacity="0.14"/>
<!-- box -->
<ellipse cx="290" cy="468" rx="180" ry="16" fill="#2A1A11" opacity="0.3"/>
<polygon points="150,200 430,200 430,460 150,460" fill="#FFF9EF"/>
<polygon points="430,200 480,160 480,420 430,460" fill="#F2A93B"/>
<polygon points="150,200 200,160 480,160 430,200" fill="#C8552F"/>
<polygon points="150,200 200,160 480,160 430,200" fill="#2A1A11" opacity="0.15"/>
<!-- side band -->
<polygon points="430,300 480,260 480,340 430,380" fill="#2A1A11"/>
<!-- front panel -->
<rect x="150" y="300" width="280" height="80" fill="#2A1A11"/>
<text x="290" y="342" text-anchor="middle" font-family="'Karla','Helvetica',sans-serif" font-weight="800" font-size="34" letter-spacing="0.14em" fill="#FFF9EF">ROOIBOS</text>
<text x="290" y="368" text-anchor="middle" font-family="'Karla','Helvetica',sans-serif" font-weight="800" font-size="13" letter-spacing="0.2em" fill="#F2A93B">RED BUSH TEA</text>
<text x="290" y="426" text-anchor="middle" font-family="'Karla','Helvetica',sans-serif" font-weight="800" font-size="14" letter-spacing="0.2em" fill="#C8552F">40 BAGS · ORGANIC</text>
<!-- sun mark on front -->
<circle cx="290" cy="252" r="30" fill="#F2A93B"/>
<path d="M240 258 A50 50 0 0 1 340 258" fill="none" stroke="#C8552F" stroke-width="8" stroke-linecap="round"/>
<!-- rooibos sprigs -->
<g stroke="#4C8A45" stroke-width="6" stroke-linecap="round" fill="none">
<path d="M100 300 C110 240 90 170 130 120"/>
<path d="M110 250 C100 250 84 230 84 216"/>
<path d="M104 210 C110 200 128 190 140 192"/>
<path d="M120 160 C108 156 96 142 98 128"/>
<path d="M124 140 C130 132 146 126 158 130"/>
</g>
<g fill="#C8552F">
<ellipse cx="84" cy="216" rx="9" ry="16" transform="rotate(30 84 216)"/>
<ellipse cx="140" cy="192" rx="9" ry="16" transform="rotate(-60 140 192)"/>
<ellipse cx="98" cy="128" rx="9" ry="16" transform="rotate(20 98 128)"/>
<ellipse cx="158" cy="130" rx="9" ry="16" transform="rotate(-70 158 130)"/>
<ellipse cx="130" cy="120" rx="9" ry="16" transform="rotate(-10 130 120)"/>
</g>
<!-- tea bag with tag -->
<path d="M510 300 L560 300 L556 420 L514 420 Z" fill="#FFF9EF"/>
<path d="M510 300 L560 300 L556 420 L514 420 Z" fill="none" stroke="#2A1A11" stroke-width="4" stroke-dasharray="6 6"/>
<path d="M535 300 L535 230" stroke="#2A1A11" stroke-width="3"/>
<rect x="515" y="200" width="40" height="30" rx="4" fill="#F2A93B" stroke="#2A1A11" stroke-width="3"/>
<!-- label -->
<rect x="50" y="500" width="500" height="56" rx="28" fill="#FFF9EF" stroke="#2A1A11" stroke-width="3"/>
<text x="300" y="536" text-anchor="middle" font-family="'Karla','Helvetica',sans-serif" font-weight="800" font-size="22" letter-spacing="0.06em" fill="#2A1A11">ORGANIC ROOIBOS TEA</text>
</svg>
