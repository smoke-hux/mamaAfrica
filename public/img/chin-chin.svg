<rect x="0" y="0" width="30" height="30" fill="#2A1A11"/>
<rect x="30" y="30" width="30" height="30" fill="#2A1A11"/>
</pattern>
</defs>
<rect width="600" height="600" fill="#D68C3C"/>
<rect width="600" height="600" fill="url(#p)" opacity="0.12"/>
<!-- tin -->
<ellipse cx="300" cy="470" rx="170" ry="16" fill="#2A1A11" opacity="0.25"/>
