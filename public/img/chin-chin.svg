<rect x="118" y="380" width="44" height="44" rx="6" transform="rotate(-30 140 402)"/>
<rect x="470" y="410" width="48" height="48" rx="6" transform="rotate(-18 494 434)"/>
<rect x="446" y="366" width="42" height="42" rx="6" transform="rotate(25 467 387)"/>
<rect x="520" y="440" width="42" height="42" rx="6" transform="rotate(40 541 461)"/>
</g>
