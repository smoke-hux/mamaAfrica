<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="t">
<title id="t">Chapati Wheat Flour</title>
<defs>
<pattern id="p" width="60" height="60" patternUnits="userSpaceOnUse">
<path d="M0 60 L60 0" fill="none" stroke="#2A1A11" stroke-width="4"/>
<circle cx="30" cy="30" r="4" fill="#2A1A11"/>
</pattern>
</defs>
<rect width="600" height="600" fill="#DCC9A6"/>
<rect width="600" height="600" fill="url(#p)" opacity="0.1"/>
<!-- shadows -->
<ellipse cx="170" cy="474" rx="130" ry="14" fill="#2A1A11" opacity="0.2"/>
<ellipse cx="420" cy="474" rx="160" ry="14" fill="#2A1A11" opacity="0.2"/>
<!-- rolling pin -->
<g transform="rotate(-14 420 270)">
<rect x="262" y="258" width="50" height="24" rx="12" fill="#2A1A11"/>
<rect x="528" y="258" width="50" height="24" rx="12" fill="#2A1A11"/>
<rect x="300" y="246" width="240" height="48" rx="24" fill="#F7CB80" stroke="#2A1A11" stroke-width="4"/>
<path d="M320 258 L520 258" stroke="#FFF9EF" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
</g>
