<g fill="#FFF9EF"><circle cx="330" cy="214" r="4"/><circle cx="470" cy="196" r="5"/><circle cx="560" cy="330" r="4"/><circle cx="290" cy="330" r="3"/><circle cx="540" cy="220" r="3"/></g>
