<text x="170" y="408" text-anchor="middle" font-family="Karla, Arial, sans-serif" font-weight="800" font-size="12" letter-spacing="0.2em" fill="#C8552F">WHEAT FLOUR</text>
<text x="170" y="444" text-anchor="middle" font-family="Karla, Arial, sans-serif" font-weight="800" font-size="20" letter-spacing="0.14em" fill="#2A1A11">2 KG</text>
<!-- plate -->
<ellipse cx="420" cy="452" rx="150" ry="26" fill="#FFF9EF" stroke="#2A1A11" stroke-width="4"/>
