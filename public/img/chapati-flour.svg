<circle cx="170" cy="282" r="46" fill="#3E6B3A"/>
<path d="M170 316 L170 256" stroke="#F2A93B" stroke-width="5" stroke-linecap="round"/>
<g fill="#F2A93B">
<ellipse cx="170" cy="252" rx="5" ry="11"/><ellipse cx="160" cy="266" rx="5" ry="11" transform="rotate(35 160 266)"/><ellipse cx="180" cy="266" rx="5" ry="11" transform="rotate(-35 180 266)"/><ellipse cx="160" cy="284" rx="5" ry="11" transform="rotate(35 160 284)"/><ellipse cx="180" cy="284" rx="5" ry="11" transform="rotate(-35 180 284)"/><ellipse cx="161" cy="302" rx="5" ry="11" transform="rotate(35 161 302)"/><ellipse cx="179" cy="302" rx="5" ry="11" transform="rotate(-35 179 302)"/>
</g>
<rect x="92" y="346" width="156" height="36" rx="6" fill="#2A1A11"/>
