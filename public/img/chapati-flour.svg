<circle cx="380" cy="364" r="7"/><circle cx="430" cy="358" r="5"/><circle cx="470" cy="368" r="7"/><circle cx="410" cy="376" r="5"/><circle cx="455" cy="380" r="4"/><circle cx="345" cy="372" r="4"/><circle cx="500" cy="374" r="4"/>
