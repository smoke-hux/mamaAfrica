<rect x="66" y="180" width="208" height="32" rx="6" fill="#C8552F" stroke="#2A1A11" stroke-width="4"/>
<path d="M76 197 L264 197" stroke="#FFF9EF" stroke-width="3" stroke-dasharray="6 6"/>
