<ellipse cx="420" cy="440" rx="122" ry="22"/>
<ellipse cx="418" cy="422" rx="122" ry="22"/>
<ellipse cx="422" cy="404" rx="122" ry="22"/>
<ellipse cx="418" cy="386" rx="122" ry="22"/>
<ellipse cx="420" cy="368" rx="122" ry="22"/>
</g>
<!-- toasted blisters on the top chapati -->
