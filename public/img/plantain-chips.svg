<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="t">
<title id="t">Salted Plantain Chips</title>
<defs>
<pattern id="p" width="80" height="50" patternUnits="userSpaceOnUse">
<polyline points="0,36 20,12 40,36 60,12 80,36" fill="none" stroke="#2A1A11" stroke-width="7" stroke-linejoin="round"/>
</pattern>
</defs>
<rect width="600" height="600" fill="#E3B23C"/>
<rect width="600" height="600" fill="url(#p)" opacity="0.12"/>
<!-- scattered chips -->
<g fill="#FFF9EF" stroke="#C8552F" stroke-width="6">
<ellipse cx="96" cy="380" rx="40" ry="30" transform="rotate(-20 96 380)"/>
<ellipse cx="130" cy="450" rx="36" ry="28" transform="rotate(25 130 450)"/>
<ellipse cx="500" cy="400" rx="42" ry="30" transform="rotate(30 500 400)"/>
<ellipse cx="470" cy="466" rx="34" ry="26" transform="rotate(-15 470 466)"/>
<ellipse cx="80" cy="200" rx="30" ry="24" transform="rotate(40 80 200)"/>
<ellipse cx="530" cy="180" rx="30" ry="24" transform="rotate(-30 530 180)"/>
</g>
<g fill="#2A1A11">
<circle cx="96" cy="380" r="5"/><circle cx="130" cy="450" r="5"/><circle cx="500" cy="400" r="5"/><circle cx="470" cy="466" r="5"/><circle cx="80" cy="200" r="4"/><circle cx="530" cy="180" r="4"/>
</g>
<!-- bag -->
<ellipse cx="300" cy="470" rx="150" ry="14" fill="#2A1A11" opacity="0.22"/>
<polygon points="180,104 200,92 220,104 240,92 260,104 280,92 300,104 320,92 340,104 360,92 380,104 400,92 420,104 420,470 400,482 380,470 360,482 340,470 320,482 300,470 280,482 260,470 240,482 220,470 200,482 180,470" fill="#C8552F"/>
<rect x="180" y="104" width="240" height="30" fill="#2A1A11"/>
<rect x="180" y="440" width="240" height="30" fill="#2A1A11"/>
<rect x="196" y="150" width="208" height="272" rx="10" fill="#FFF9EF"/>
<circle cx="300" cy="284" r="72" fill="#4C8A45"/>
<!-- plantain on badge -->
<path d="M248 292 C264 250 336 246 352 284 C324 272 272 276 248 292 Z" fill="#F2A93B"/>
<path d="M248 292 C266 318 330 320 352 284 C324 302 272 306 248 292 Z" fill="#F2A93B"/>
<path d="M352 284 L366 280 L364 290 Z" fill="#2A1A11"/>
<text x="300" y="196" text-anchor="middle" font-family="'Karla','Helvetica',sans-serif" font-weight="800" font-size="30" letter-spacing="0.1em" fill="#2A1A11">PLANTAIN</text>
<text x="300" y="396" text-anchor="middle" font-family="'Karla','Helvetica',sans-serif" font-weight="800" font-size="20" letter-spacing="0.2em" fill="#C8552F">SEA SALT</text>
<!-- label -->
<rect x="50" y="500" width="500" height="56" rx="28" fill="#FFF9EF" stroke="#2A1A11" stroke-width="3"/>
<text x="300" y="536" text-anchor="middle" font-family="'Karla','Helvetica',sans-serif" font-weight="800" font-size="22" letter-spacing="0.06em" fill="#2A1A11">SALTED PLANTAIN CHIPS</text>
</svg>
