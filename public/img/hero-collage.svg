<g fill="#2A1A11"><circle cx="60" cy="600" r="5"/><circle cx="850" cy="560" r="5"/><circle cx="820" cy="80" r="4"/></g>
<!-- confetti dots -->
<g fill="#C8552F"><circle cx="420" cy="40" r="8"/><circle cx="60" cy="90" r="6"/><circle cx="880" cy="380" r="7"/></g>
<g fill="#4C8A45"><circle cx="470" cy="20" r="5"/><circle cx="30" cy="440" r="6"/></g>
