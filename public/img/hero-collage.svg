<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-labelledby="t">
<title id="t">Mama Afrika Market pantry collage</title>
<defs>
<pattern id="p" width="60" height="60" patternUnits="userSpaceOnUse">
<circle cx="30" cy="30" r="4" fill="#2A1A11"/>
