<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="t">
<title id="t">Coconut Mandazi Mix</title>
<defs>
<pattern id="p" width="56" height="56" patternUnits="userSpaceOnUse">
<polygon points="28,8 48,44 8,44" fill="none" stroke="#2A1A11" stroke-width="4" stroke-linejoin="round"/>
</pattern>
</defs>
<rect width="600" height="600" fill="#F7CB80"/>
<rect width="600" height="600" fill="url(#p)" opacity="0.08"/>
<!-- steam -->
<g fill="none" stroke="#2A1A11" stroke-width="8" stroke-linecap="round" opacity="0.22">
<path d="M290 220 c-18 -24 18 -48 0 -78"/>
<path d="M350 210 c-18 -26 18 -52 0 -84"/>
<path d="M410 226 c-18 -24 18 -48 0 -78"/>
</g>
<!-- coconut half -->
