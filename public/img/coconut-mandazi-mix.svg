<ellipse cx="330" cy="420" rx="210" ry="56" fill="#FFF9EF" stroke="#2A1A11" stroke-width="4"/>
<ellipse cx="330" cy="420" rx="170" ry="38" fill="none" stroke="#C8552F" stroke-width="4" opacity="0.5"/>
