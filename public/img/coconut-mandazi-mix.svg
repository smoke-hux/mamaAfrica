<g fill="#F7CB80" opacity="0.8">
<ellipse cx="238" cy="392" rx="12" ry="6" transform="rotate(-30 238 392)"/><ellipse cx="410" cy="386" rx="12" ry="6" transform="rotate(20 410 386)"/><ellipse cx="326" cy="404" rx="12" ry="6"/><ellipse cx="296" cy="352" rx="12" ry="6" transform="rotate(20 296 352)"/><ellipse cx="376" cy="344" rx="12" ry="6" transform="rotate(-20 376 344)"/>
