<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2A1A11">
  <title>Shop | Mama Afrika Market</title>
  <meta name="description" content="Browse African spices, sauces, staples, snacks, drinks and meal kits. Filter by aisle, search, and sort.">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/site.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body data-page="shop">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <section class="shop-intro page-intro" aria-labelledby="shop-title">
      <div class="container">
        <div>
          <p class="eyebrow">The market</p>
          <h1 id="shop-title" data-shop-title>Shop <span class="italic-accent">everything</span></h1>
          <p class="lead" data-shop-lead>Every jar, sachet and kit we stock, straight from the source.</p>
        </div>
        <p class="shop-intro__meta">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg>
          Free standard shipping over $60
        </p>
      </div>
    </section>

    <div class="filter-bar">
      <div class="container filter-bar__inner">
        <div class="chips" role="group" aria-label="Filter by category" data-chips>
          <button class="chip" type="button" data-testid="category-chip" data-category="" aria-pressed="true">All</button>
        </div>
        <div class="filter-tools">
          <form class="filter-search" role="search" data-search-form>
            <label class="visually-hidden" for="shop-search">Search products</label>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input class="input" id="shop-search" type="search" name="q" placeholder="Search the market…" autocomplete="off" data-testid="search-input">
            <button class="filter-search__clear" type="button" aria-label="Clear search" data-search-clear hidden>
              <svg class="icon icon--sm" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
          </form>
          <label class="filter-sort">
            <span class="visually-hidden">Sort by</span>
            <select class="input" data-testid="sort-select" data-sort>
              <option value="featured">Featured</option>
              <option value="price-asc">Price: low to high</option>
              <option value="price-desc">Price: high to low</option>
              <option value="rating">Top rated</option>
              <option value="name">Name A–Z</option>
            </select>
          </label>
        </div>
      </div>
    </div>

    <section class="container shop-results" aria-labelledby="results-title">
      <h2 class="visually-hidden" id="results-title">Products</h2>
      <div class="shop-results__head">
        <p class="result-count" aria-live="polite" data-count>Loading products…</p>
        <div data-active-tag></div>
      </div>
      <div class="grid grid--products" data-grid aria-busy="true"></div>
      <div data-empty hidden></div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script type="module" src="/js/layout.js"></script>
  <script type="module" src="/js/pages/shop.js"></script>
</body>
</html>
